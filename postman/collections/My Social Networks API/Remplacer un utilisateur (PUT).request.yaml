$kind: http-request
description: |-
  ### Explication fonctionnelle

  Remplace entièrement les données d'un utilisateur. Les champs optionnels non envoyés (avatar_url, bio) sont remis à vide.

  ### Données envoyées (JSON)

  - email (obligatoire, unique)
      
  - first_name (obligatoire)
      
  - last_name (obligatoire)
      
  - avatar_url (optionnel)
      
  - bio (optionnel)
      

  ### Données retournées

  L'utilisateur mis à jour. Code 200.

  ### Erreurs

  - 400 : un champ obligatoire est manquant
      
  - 404 : utilisateur introuvable
      
  - 409 : email déjà utilisé par un autre utilisateur
url: "{{baseUrl}}/users/4"
method: PUT
body:
  type: json
  content: "{\r

    \  \"email\": \"carl@example.com\",\r

    \  \"first_name\": \"Carl\",\r

    \  \"last_name\": \"Durand\"\r

    }"
examples: .resources/Remplacer un utilisateur (PUT).resources/examples
order: 3000
